[project]
name = "lore-auth-server"
version = "0.1.0"
description = "Minimal user/password authentication service for Lore version control servers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.84.0",
    "protobuf>=7.35.1",
    "cryptography>=42",
]

[project.scripts]
lore-auth-server = "lore_auth_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lore_auth_server"]
